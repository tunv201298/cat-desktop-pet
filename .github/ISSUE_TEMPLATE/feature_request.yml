name: Idea or request
description: Suggest a new activity, setting or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the cat to do, or what should work differently?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
